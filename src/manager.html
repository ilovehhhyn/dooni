<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chats</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="manager.css" />
</head>
<body class="mgr-body">
  <header class="mgr-toolbar">
    <div class="toolbar-actions">
      <button id="lock-btn" class="icon-button pin-button" type="button" title="Pin window" aria-label="Pin window" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.5"></circle>
        </svg>
      </button>
      <button id="settings-btn" class="icon-button" type="button" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="2.25"></circle>
          <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"></path>
        </svg>
      </button>
    </div>
    <span id="session-count" class="session-count"></span>
  </header>

  <main class="mgr-main">
    <ul id="mgr-list-ul" class="mgr-list"></ul>
  </main>

  <section id="settings-panel" class="settings-panel hidden" aria-label="Settings">
    <header class="settings-header">
      <h1>settings</h1>
      <button id="settings-close" class="icon-button" type="button" aria-label="Close settings">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8"></path>
        </svg>
      </button>
    </header>

    <div class="settings-group">
      <h2>runtime</h2>
      <div class="runtime-picker" role="group" aria-label="Title runtime">
        <button class="runtime-option" data-runtime="codex" type="button">Codex</button>
        <button class="runtime-option" data-runtime="anthropic" type="button">Anthropic</button>
      </div>
      <div id="codex-runtime" class="runtime-detail">
        <span id="codex-runtime-state">checking</span>
        <button id="codex-runtime-action" class="text-button" type="button"></button>
      </div>
      <div id="anthropic-runtime" class="runtime-detail hidden">
        <input id="settings-anthropic-key" type="password" placeholder="Anthropic API key" autocomplete="off" />
      </div>
      <button id="runtime-save" class="primary-button" type="button">save runtime</button>
    </div>

    <div class="settings-group manual">
      <h2>manual</h2>
      <dl>
        <div><dt>⌘⇧D</dt><dd>open notes for the current chat</dd></div>
        <div><dt>chat title</dt><dd>surface the original chat</dd></div>
        <div><dt>open</dt><dd>open notes in a new window</dd></div>
        <div><dt>edit</dt><dd>rename and lock the title</dd></div>
        <div><dt>circle</dt><dd>pin or unpin this window</dd></div>
      </dl>
    </div>
  </section>

  <div id="mgr-status" class="mgr-status" role="status" aria-live="polite"></div>
  <script src="manager.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>dooni</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Always-visible pin/lock toggle (top of every window). -->
  <button id="lock-btn" class="lock-btn" title="pin on top">🔒</button>

  <!-- Screen: welcome (main window, first-time, no active session) -->
  <div id="screen-welcome" class="screen hidden">
    <div class="center">
      <div class="blob"></div>
      <div class="welcome-text">welcome to dooni</div>
    </div>
  </div>

  <!-- Screen: greeting (main window, returning user, no active session) -->
  <div id="screen-greeting" class="screen hidden">
    <div class="center">
      <div class="blob"></div>
      <div class="welcome-text" id="greeting-text">dooni says hi</div>
    </div>
  </div>

  <!-- Screen: onboarding (main window, first-time, live session detected) -->
  <div id="screen-onboard" class="screen hidden">
    <div class="center onboard-inner">
      <div class="blob"></div>
      <div class="onboard-title">before we start</div>
      <label>your name<input id="ob-name" type="text" placeholder="helen" autocomplete="off" /></label>
      <label>anthropic api key<input id="ob-anthropic-key" type="password" placeholder="sk-ant-..." autocomplete="off" /></label>
      <div class="ob-or">or</div>
      <label>codex / openai api key<input id="ob-codex-key" type="password" placeholder="sk-..." autocomplete="off" /></label>
      <button id="ob-save">start</button>
      <div id="ob-error"></div>
    </div>
  </div>

  <!-- Screen: memo (session windows) -->
  <div id="screen-memo" class="screen hidden">
    <div id="app">
      <header>
        <div class="topbar">
          <button id="toggle" class="toggle" title="toggle mode">curt</button>
        </div>
        <div class="blob" id="memo-blob"></div>
        <div class="title">dooni</div>
        <div class="sub" id="memo-sub">running memo</div>
      </header>
      <main>
        <ul id="topics"><li class="empty">// no topics yet, start chatting</li></ul>
      </main>
      <footer>
        <button id="clear">clear</button>
        <span id="status">watching...</span>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title></title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="lock-btn" class="icon-button lock-btn" type="button" title="Pin window" aria-label="Pin window" aria-pressed="false">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5"></circle>
    </svg>
  </button>

  <!-- Screen: onboarding (main window only) -->
  <div id="screen-onboard" class="screen hidden">
    <div class="center onboard-inner">
      <div class="blob"></div>
      <div class="onboard-title">connect dooni</div>
      <label>your name<input id="ob-name" type="text" placeholder="helen" autocomplete="name" /></label>

      <div id="ob-runtime-step" class="onboarding-step">
        <div class="auth-card">
          <span id="ob-codex-dot" class="auth-dot"></span>
          <div>
            <strong>Codex</strong>
            <span id="ob-codex-status">checking</span>
          </div>
        </div>
        <button id="ob-codex-action" class="ob-primary" type="button" disabled>checking</button>

        <button id="ob-use-anthropic" class="ob-secondary" type="button">use Anthropic API instead</button>
        <div id="ob-anthropic-panel" class="anthropic-panel hidden">
          <label>anthropic api key<input id="ob-anthropic-key" type="password" placeholder="sk-ant-..." autocomplete="off" /></label>
          <button id="ob-anthropic-save" class="ob-primary" type="button">continue with Anthropic</button>
        </div>
      </div>

      <div id="ob-claude-step" class="onboarding-step hidden">
        <div class="auth-card">
          <span id="ob-claude-dot" class="auth-dot"></span>
          <div>
            <strong>Claude Desktop</strong>
            <span id="ob-claude-status">checking</span>
          </div>
        </div>
        <button id="ob-claude-action" class="ob-primary" type="button" disabled>checking</button>
        <button id="ob-claude-skip" class="ob-secondary" type="button">skip Claude Desktop</button>
      </div>
      <div id="ob-error"></div>
    </div>
  </div>

  <!-- Screen: memo (session windows) -->
  <div id="screen-memo" class="screen hidden">
    <div id="app" class="session-app">
      <header class="session-header">
        <div class="title" id="memo-title">Untitled chat</div>
      </header>

      <div id="asked-search-row" class="asked-search-row hidden">
        <label class="asked-search">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.25"></circle>
            <path d="m10.25 10.25 3 3"></path>
          </svg>
          <input id="asked-search" type="search" placeholder="Search asked" aria-label="Search asked prompts" autocomplete="off" spellcheck="false" />
        </label>
      </div>

      <nav class="tabs" aria-label="conversation notes">
        <button class="tab active" data-tab="future" type="button">
          thoughts <span id="prompt-count">0</span>
        </button>
        <button class="tab" data-tab="asked" type="button">
          asked <span id="asked-count">0</span>
        </button>
      </nav>

      <main class="session-main">
        <section id="panel-future" class="panel active">
          <ul id="future-prompts" class="prompt-list"></ul>
          <form id="prompt-form" class="prompt-composer">
            <button class="composer-check" type="submit" aria-label="Add thought"></button>
            <textarea id="prompt-input" rows="1" placeholder="Add a thought" aria-label="Thought"></textarea>
          </form>
        </section>

        <section id="panel-asked" class="panel">
          <ol id="asked-prompts" class="asked-list"></ol>
        </section>
      </main>

      <div id="status" class="status-toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
